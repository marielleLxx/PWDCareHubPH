    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!----- site navbar ----->
    <nav class="site-nav">
      <button class="sidebar-toggle">
        <span class="material-symbols-rounded"

          <!-- <span class="menu-label">PWD Care Hub PH</span> -->
          <button class="sidebar-toggle">
            <span class="material-symbols-rounded"
              ><img src="media assets/left-arrow.png"
            /></span>
          </button>
        </header>

        <div class="sidebar-content">
          <!-- MENU LIST -->
          <ul class="menu-list">
            <li class="menu-item">
              <a href="home.html" class="menu-link">
                <span class="material-symbols-rounded"
                  ><img src="media assets/home_icon.png" class="icon"
                /></span>
                <span class="menu-label">Home</span>
              </a>
            </li>
            <li class="menu-item">
              <a href="pwdIdApp.html" class="menu-link">
                <span class="material-symbols-rounded"
                  ><img src="media assets/pwdIdApp_icon.png" class="icon"
                /></span>
                <span class="menu-label">PWD ID Application Guide</span>
              </a>
            </li>
            <li class="menu-item">
              <a href="benefits.html" class="menu-link">
                <span class="material-symbols-rounded"
                  ><img src="media assets/benefits_icon.png" class="icon"
                /></span>
                <span class="menu-label">Benefits and Discounts</span>
              </a>
            </li>
            <li class="menu-item">
              <a href="program.html" class="menu-link active">
                <span class="material-symbols-rounded"

                    src="media assets/programservices_icon.png"

              </a>
            </li>
            <li class="menu-item">
              <a href="employment.html" class="menu-link">

            <li class="menu-item">

                /></span>

              </a>
            </li>
          </ul>
          <!-- SEARCH FORM -->
          <form
            class="search-form"
            role="search"
            onsubmit="performSearch(event)"
            style="position: relative; width: 100%; max-width: 600px"
          >
            <div style="position: relative; flex: 1">
              <input
                class="form-control"
                type="search"
                id="searchInput"
                placeholder="Search PWD services"
                aria-label="Search PWD website"
                onkeydown="handleKey(event)"
                style="padding-right: 50px; width: 100%"
              />
              <button
                class="btn"
                type="button"
                onclick="startVoiceSearch()"
                aria-label="Voice search"
                style="
                  position: absolute;
                  right: 8px;
                  top: 50%;
                  transform: translateY(-50%);
                  background: none;
                  border: none;
                  font-size: 18px;
                  cursor: pointer;
                  padding: 5px;
                  z-index: 10;
                "
              >
                🎤
              </button>
            </div>
            <button
              class="btn btn-outline-success"
              type="submit"
              aria-label="Submit search"
            >
              Search
            </button>
          </form>
          <div id="results" role="region" aria-live="polite"></div>
        </div>
